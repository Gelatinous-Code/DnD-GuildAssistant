version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "15:00"
      timezone: America/Denver
    labels:
      - dependencies
      - "release: maintenance"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "15:30"
      timezone: America/Denver
    labels:
      - dependencies
      - "release: maintenance"
    open-pull-requests-limit: 5
